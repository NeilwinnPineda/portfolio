<section
  id="home"
  class="shell-section shell-section--home focus-shell"
  data-spy-section
  aria-label="Home"
  [class.is-active-section]="activeSection() === 'home'"
  [class.is-visible-section]="isVisible('home')"
  [class.is-muted-section]="activeSection() !== 'home'"
>
  <app-home />
</section>

<section
  id="lab"
  class="shell-section shell-section--lab focus-shell"
  data-spy-section
  aria-label="Lab"
  [class.is-active-section]="activeSection() === 'lab'"
  [class.is-visible-section]="isVisible('lab')"
  [class.is-muted-section]="activeSection() !== 'lab'"
>
  <div class="lab-shell">
    <div class="lab-shell-intro">
      <span class="lab-shell-section-label">Lab</span>
      <h1 class="lab-shell-heading">Interactive Runtime Sandbox</h1>
    </div>
    @if (!labLoaded()) {
      <div class="lab-start-cue">
        <span class="lab-start-whisper">runtime waiting</span>
        <button type="button" class="lab-start-btn" (click)="loadLab()">
          <svg class="lab-start-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
            <circle cx="12" cy="12" r="9"/>
          </svg>
          Press To Start
        </button>
      </div>
    } @else {
      <div class="lab-shell-toolbar">
        <span class="lab-shell-label">3D Lab Runtime</span>
        <button type="button" class="lab-shell-btn lab-shell-btn--danger" (click)="unloadLab()">Unload</button>
      </div>
    }
  </div>
  @if (labLoaded()) {
    <div class="lab-scene-shell">
      <app-scene />
    </div>
  }
</section>
